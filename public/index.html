<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QVAC Interview Question Bank Generator</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #f4f5fa;
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #211f33;
    display: flex;
    justify-content: center;
    padding: 48px 20px;
  }
  .wrap { width: 100%; max-width: 560px; }
  .card {
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 2px 14px rgba(30,20,70,0.08);
    padding: 34px 36px;
  }
  .brand { font-size: 0.7rem; letter-spacing: 3px; text-transform: uppercase; color: #5b3fd9; font-weight: 700; margin-bottom: 6px; }
  h1 { font-size: 1.5rem; margin: 0 0 6px; color: #201d3a; font-weight: 800; }
  .subtitle { color: #625d80; font-size: 0.9rem; margin-bottom: 26px; }
  .field-label { font-size: 0.78rem; color: #625d80; margin-bottom: 6px; font-weight: 600; }
  input[type=text] {
    width: 100%;
    padding: 11px 12px;
    border-radius: 8px;
    border: 1px solid #d3d0e8;
    background: #fbfbfe;
    color: #211f33;
    font-family: inherit;
    font-size: 0.95rem;
    margin-bottom: 16px;
  }
  input[type=text]:focus { outline: none; border-color: #5b3fd9; }
  button.action {
    padding: 11px 24px;
    border: none;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    background: #5b3fd9;
    color: #fff;
  }
  button.action:hover:not(:disabled) { background: #4830b0; }
  button.action:disabled { opacity: 0.4; cursor: not-allowed; }
  .status { margin-top: 14px; font-size: 0.85rem; color: #8a86a3; min-height: 1.2em; }
  .result-list { margin-top: 22px; list-style: none; padding: 0; counter-reset: qnum; }
  .result-list li {
    counter-increment: qnum;
    padding: 14px 16px 14px 40px;
    position: relative;
    background: #f2f0fb;
    border-left: 3px solid #5b3fd9;
    border-radius: 6px;
    margin-bottom: 10px;
    font-size: 0.98rem;
    line-height: 1.5;
    color: #211f33;
  }
  .result-list li::before {
    content: counter(qnum);
    position: absolute;
    left: 12px;
    top: 14px;
    font-weight: 800;
    color: #5b3fd9;
    font-size: 0.85rem;
  }
  .footer-note { color: #8a86a3; font-size: 0.78rem; text-align: center; margin-top: 22px; }
  .spinner {
    display: inline-block;
    width: 12px; height: 12px;
    border: 2px solid #e0deef;
    border-top-color: #5b3fd9;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="brand">On-Device Interview Coach</div>
      <h1>Interview Question Bank Generator</h1>
      <p class="subtitle">Enter a job role, get 5 realistic interview questions to prep with.</p>

      <div class="field-label">JOB ROLE</div>
      <input type="text" id="roleInput" placeholder="e.g. junior backend developer" />
      <button class="action" id="generateBtn">Generate Questions</button>
      <div class="status" id="status"></div>
      <ul class="result-list" id="resultList"></ul>
    </div>

    <p class="footer-note">Everything runs locally on your machine. No text ever leaves this device.</p>
  </div>

  <script>
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    const roleInput = document.getElementById('roleInput');
    const generateBtn = document.getElementById('generateBtn');
    const status = document.getElementById('status');
    const resultList = document.getElementById('resultList');

    async function generate() {
      const role = roleInput.value.trim();
      if (!role) return;
      generateBtn.disabled = true;
      resultList.innerHTML = '';
      status.innerHTML = '<span class="spinner"></span>Generating questions...';

      try {
        const res = await fetch('/api/interview-questions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ role }),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        status.textContent = '';
        resultList.innerHTML = data.questions.map(q => `<li>${escapeHtml(q)}</li>`).join('');
      } catch (err) {
        status.textContent = 'Error: ' + err.message;
      } finally {
        generateBtn.disabled = false;
      }
    }

    generateBtn.addEventListener('click', generate);
    roleInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') generate(); });
  </script>
</body>
</html>
